# 38 - Secret scanning: stop credentials before they reach the repo
#
# The most common way secrets leak is boring: someone pastes an API key into a
# config file and pushes it. GitHub tackles this from two directions.
#
# 1) PLATFORM SECRET SCANNING (a repo SETTING, not a workflow)
#    Settings -> Code security -> Secret scanning + Push protection.
#      * Secret scanning watches for known token formats (AWS, Stripe, GitHub
#        PATs, Google, ...) already in your history and alerts on matches.
#      * PUSH PROTECTION goes further: it BLOCKS the push at `git push` time if
#        it spots a recognised secret, before the secret ever lands on GitHub.
#    Free on public repos; needs GitHub Advanced Security on private repos.
#    There is nothing to put in YAML for this — enable it in settings once.
#
# 2) A SCANNER IN CI (this workflow)
#    Platform scanning only knows *published provider* formats. A scanner in the
#    pipeline (here: gitleaks) also catches generic high-entropy strings,
#    private keys, and `.env` files — and fails the build so a leak can't merge.
#    This is your safety net for custom or homegrown secret formats.
#
# ⚠️ ONE CRUCIAL RULE: if a secret was EVER committed, rotate it. Deleting the
#    file does NOT help — it lives forever in git history and in every clone and
#    fork. Treat any committed credential as burned: revoke and reissue it.
#
# 🔒 A subtlety worth knowing: `fetch-depth: 0` checks out the FULL history so
#    the scanner can inspect every commit on a PR, not just the tip. Without it
#    a secret buried a few commits back can slip past.
#
# WHAT TO OBSERVE: on a clean repo the scan passes. Commit a fake key like
#   AWS_SECRET_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE
# on a branch, open a PR, and watch the job go red and point at the exact line.

name: 38 - Secret Scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # 🔒 full history so every commit is scanned

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Needed only to post PR comments / summaries. The scan itself is
          # free and needs no license key on public repos.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: What to do on a hit
        if: failure()
        run: |
          echo "A secret was detected. Do NOT just delete the file:"
          echo "  1. ROTATE the credential at its provider immediately."
          echo "  2. Remove it from code; load it from secrets/env instead."
          echo "  3. Purge history only if truly necessary (git filter-repo)."
